[project]
name = "chapter-3-framework-bakeoff"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
openai-agents = ["openai-agents==0.18.2"]
langchain = ["langchain==1.3.13", "langchain-openai==1.3.5"]
autogen = ["autogen-agentchat==0.7.5", "autogen-ext[openai]==0.7.5"]
pydantic-ai = ["pydantic-ai-slim[openai]==2.9.0"]
llamaindex = ["llama-index-core==0.14.23", "llama-index-llms-openai==0.7.9"]
mistral = ["mistralai==2.6.0"]
crewai = ["crewai==1.15.2"]
google-adk = ["google-adk==2.4.0"]
claude-agent-sdk = ["claude-agent-sdk==0.2.116"]

[tool.uv]
package = false
conflicts = [
    [
        { extra = "openai-agents" },
        { extra = "langchain" },
        { extra = "autogen" },
        { extra = "pydantic-ai" },
        { extra = "llamaindex" },
        { extra = "mistral" },
        { extra = "crewai" },
        { extra = "google-adk" },
        { extra = "claude-agent-sdk" },
    ],
]
